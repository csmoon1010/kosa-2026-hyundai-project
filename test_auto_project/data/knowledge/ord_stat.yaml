# 주문상태 그래프 재료 — 사람이 확인한 업무 지식 (자동 생성 아님)
# 출처: 권지은, 2026-10-25 — 공통코드 ORD_STAT_GBCD + multiOshpProcess · multiOshpBackProcess 소스 확인

graph:
  id: ORD_STAT_GBCD               # 그래프 하나 = 상태 코드 그룹 하나
  name: 주문상태
  domain: od                      # 담당 = 상태 코드 그룹의 주인 (동작 API 는 물류 ds 것을 붙임)
  entity: 주문
  state_field: lastDlvstPrgrGbcd  # 조회 응답에서 마지막 상태를 읽는 필드
  entry_states: ["25"]            # 외부(고객 주문 · 결제)에서 들어와 우리가 API 로 처음 다룰 수 있는 상태
  verify_key_fields: [ordNo, ordPtcSeq]   # 결과 확인 때 같은 주문을 다시 찾는 키

code_group:
  id: ORD_STAT_GBCD
  name: 주문상태구분코드
  codes:
    "10": 접수
    "20": 결제완료
    "25": 출고대기
    "26": 매장승인
    "27": 매장출발
    "30": 출고진행
    "45": 출고
    "50": 배송완료
    "55": 회수요청
    "57": 회수집하
    "60": 회수확인
    "63": 회수완료
    "70": 취소회수요청
    "73": 취소회수집하
    "75": 취소회수완료
    "77": 취소출고
    "79": 취소출고배송완료
    "80": 완료
    "81": 취소완료
    "82": 수선완료
    "91": A/S취소
    "92": 반품전환
    "93": 교환전환

# 동작 = API + 고정 선택값(procGb). 전제 상태 → 효과 상태
transitions:
  - api: "hshop-openapi:POST:/sc/scb/scbd/multiOshpProcess.do"
    selector: {procGb: P1}
    name: 출고진행
    from: "25"
    to: "30"
  - api: "hshop-openapi:POST:/sc/scb/scbd/multiOshpProcess.do"
    selector: {procGb: P2}
    name: 출고완료
    from: "30"
    to: "45"
  - api: "hshop-openapi:POST:/sc/scb/scbd/multiOshpProcess.do"
    selector: {procGb: P3}
    name: 배송완료
    from: "45"
    to: "50"
  - api: "hshop-openapi:POST:/sc/scb/scbd/multiOshpBackProcess.do"
    selector: {procGb: PB1}
    name: 출고취소
    from: "30"
    to: "25"
  - api: "hshop-openapi:POST:/sc/scb/scbd/multiOshpBackProcess.do"
    selector: {procGb: PB2}
    name: 출고완료취소
    from: "45"
    to: "30"
  - api: "hshop-openapi:POST:/sc/scb/scbd/multiOshpBackProcess.do"
    selector: {procGb: PB3}
    name: 배송완료취소
    from: "50"
    to: "45"

# 상태별 조회 방법 — 조회 API + 고정 선택값(prgrGb). 서버가 '마지막 상태'로 걸러 준다.
# 응답의 lastDlvstPrgrGbcd 가 마지막 상태 (같은 ORD_STAT_GBCD 체계)
lookups:
  - api: "hshop-openapi:POST:/sc/scb/scbd/selectOshpDtlList.do"    # 출고조회
    selector: {prgrGb: P0}
    states: ["25"]
  - api: "hshop-openapi:POST:/sc/scb/scbd/selectOshpDtlList.do"
    selector: {prgrGb: P1}
    states: ["30"]
  - api: "hshop-openapi:POST:/sc/scb/scbd/selectOshpDtlList.do"
    selector: {prgrGb: P2}
    states: ["45"]
  - api: "hshop-openapi:POST:/sc/scb/scbd/selectOshpDtlList.do"
    selector: {prgrGb: P3}
    states: ["50"]
  - api: "hshop-openapi:POST:/sc/scb/scbd/selectWtdwDtlList.do"    # 회수조회
    selector: {prgrGb: P0}
    states: ["55", "56"]          # 56 은 위 코드 목록에 없음 — 확인 필요
  - api: "hshop-openapi:POST:/sc/scb/scbd/selectWtdwDtlList.do"
    selector: {prgrGb: P1}
    states: ["57", "60"]          # 두 상태를 함께 조회 — 구분은 응답의 lastDlvstPrgrGbcd 로
  - api: "hshop-openapi:POST:/sc/scb/scbd/selectWtdwDtlList.do"
    selector: {prgrGb: P2}
    states: ["63"]
