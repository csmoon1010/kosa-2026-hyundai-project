    paths: [{graph_id: ORD_STAT_GBCD, from_state: 출고진행, to_state: 출고대기, edges: [출고취소]}]
    apis: [[1, 0, selectOshpDtlList, {prgrGb: P1}], [1, 1, multiOshpBackProcess, {procGb: PB1}]]
    status: [완료]

- id: N03
