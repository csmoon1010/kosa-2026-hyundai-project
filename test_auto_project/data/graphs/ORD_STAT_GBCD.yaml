# 주문상태 그래프 — 사람이 확인한 노드 흐름 (자동 생성 아님)
# 출처: 권지은, 2026-10-25 — 공통코드 ORD_STAT_GBCD + multiOshpProcess · multiOshpBackProcess 소스 확인
# 2026-11-03: 그래프는 노드 흐름(상태 · 화살표 · 업무 이름)만 — 화살표의 API · 구분값과 조회 방법은 뺐다.
#   API 와 '조회로 찾을 수 있는 상태'는 시나리오를 만들 때(② 경로 탐색 · ③ API 선택) API Metadata 로 정한다.
#   사람이 바로잡을 곳은 관리자 › 규칙 입력(API Metadata 별칭 · 구분값). 소스로 확인했던 API 는 정답지 data/golden/ORD_STAT_GBCD.yaml 에 남아 있다.

graph:
  id: ORD_STAT_GBCD               # 그래프 하나 = 상태 코드 그룹 하나
  name: 주문상태
  domain: od                      # 담당 = 상태 코드 그룹의 주인 (동작 API 는 물류 ds 것을 붙임)
  entity: 주문
  state_field: lastDlvstPrgrGbcd  # 조회 응답에서 마지막 상태를 읽는 필드
  entry_states: ["25"]            # 외부(고객 주문 · 결제)에서 들어와 우리가 API 로 처음 다룰 수 있는 상태
  verify_key_fields: [ordNo, ordPtcSeq]   # 결과 확인 때 같은 주문을 다시 찾는 키

code_group:
  id: ORD_STAT_GBCD
  name: 주문상태구분코드
  codes:
    "10": 접수
    "20": 결제완료
    "25": 출고대기
    "26": 매장승인
    "27": 매장출발
    "30": 출고진행
    "45": 출고
    "50": 배송완료
    "55": 회수요청
    "57": 회수집하
    "60": 회수확인
    "63": 회수완료
    "70": 취소회수요청
    "73": 취소회수집하
    "75": 취소회수완료
    "77": 취소출고
    "79": 취소출고배송완료
    "80": 완료
    "81": 취소완료
    "82": 수선완료
    "91": A/S취소
    "92": 반품전환
    "93": 교환전환

# 동작 = API + 고정 선택값(procGb). 전제 상태 → 효과 상태
transitions:
  - name: 출고진행
    from: "25"
    to: "30"
  - name: 출고완료
    from: "30"
    to: "45"
  - name: 배송완료
    from: "45"
    to: "50"
  - name: 출고취소
    from: "30"
    to: "25"
  - name: 출고완료취소
    from: "45"
    to: "30"
  - name: 배송완료취소
    from: "50"
    to: "45"
