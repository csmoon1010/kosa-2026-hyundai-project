# 자동 추출 (실험) — 공통코드 + 명세만, 모델 gpt-5.4. 사람 확인 전
graph:
  id: ORD_STAT_GBCD
  name: 주문상태구분코드
  domain: od
  entity: 주문/주문상세(물류처리 대상 주문선)
  state_field: lastDlvstPrgrGbcd
  entry_states:
  - '25'
  - '55'
  - '70'
  verify_key_fields:
  - ordNo
  - ordPtcSeq
  - dlvstNo
  - dlvstPtcSeq
  - venCd
  - ven2Cd
code_group:
  id: ORD_STAT_GBCD
  name: 주문상태구분코드
  codes:
    '10': 접수
    '20': 결제완료
    '25': 출고대기
    '26': 매장승인
    '27': 매장출발
    '30': 출고진행
    '45': 출고
    '50': 배송완료
    '55': 회수요청
    '57': 회수집하
    '60': 회수확인
    '63': 회수완료
    '70': 취소회수요청
    '73': 취소회수집하
    '75': 취소회수완료
    '77': 취소출고
    '79': 취소출고배송완료
    '80': 완료
    '81': 취소완료
    '82': 수선완료
    '91': A/S취소
    '92': 반품전환
    '93': 교환전환
transitions:
- api: hshop-openapi:POST:/sc/scb/scbd/multiOshpProcess.do
  selector:
    procGb: P1
  name: 주문확인 처리
  from: '25'
  to: '30'
  source: llm
  basis: guess
  evidence: API summary가 '주문확인(P1)/출고완료(P2)/배송완료(P3) 처리'. 출고조회 응답의 예시 상태가 25(출고대기)이며,
    주문확인 후 다음 물류 진행 상태는 일반적으로 출고진행(30)으로 추정.
- api: hshop-openapi:POST:/sc/scb/scbd/multiOshpProcess.do
  selector:
    procGb: P2
  name: 출고완료 처리
  from: '30'
  to: '45'
  source: llm
  basis: spec
  evidence: API summary에 '출고완료(P2)'가 명시되어 있고 공통코드에 45=출고가 존재.
- api: hshop-openapi:POST:/sc/scb/scbd/multiOshpProcess.do
  selector:
    procGb: P3
  name: 배송완료 처리
  from: '45'
  to: '50'
  source: llm
  basis: spec
  evidence: API summary에 '배송완료(P3)'가 명시되어 있고 공통코드에 50=배송완료가 존재.
- api: hshop-openapi:POST:/sc/scb/scbd/multiOshpBackProcess.do
  selector:
    procGb: PB1
  name: 출고취소처리
  from: '25'
  to: '77'
  source: llm
  basis: guess
  evidence: API summary가 '출고취소처리'. 공통코드에 취소 관련 출고 상태로 77=취소출고가 존재. 어떤 선행상태에서 호출 가능한지는
    명시 부족하나 출고대기 건 취소로 추정.
- api: hshop-openapi:POST:/sc/scb/scbd/multiWtdwProcess.do
  selector: {}
  name: 회수처리
  from: '55'
  to: '57'
  source: llm
  basis: guess
  evidence: API summary가 '회수처리'. 공통코드상 회수 흐름은 55=회수요청, 57=회수집하, 60=회수확인, 63=회수완료 순으로
    보이며, 회수조회 API는 상태 필드 lastDlvstPrgrGbcd를 제공. 이 write API가 송장번호/택배사코드를 받아 최초 회수
    진행을 등록하는 동작으로 보여 55→57로 추정.
- api: hshop-openapi:POST:/sc/scb/scbd/multiTcktOrdProcess.do
  selector:
    procGb: P1
  name: 티켓 주문처리
  from: '20'
  to: '80'
  source: llm
  basis: guess
  evidence: 티켓 주문조회 응답 예시에서 lastOrdStatGbcd=20, API summary는 단일 '주문처리'. 티켓은 실물 출고
    없이 처리될 수 있어 결제완료(20)에서 완료(80)로 갈 가능성을 추정했으나 명세상 확정 불가.
- api: hshop-openapi:POST:/sc/scb/scbd/multiTcktWtdwProcess.do
  selector:
    procGb: P0
  name: 티켓 회수처리
  from: '55'
  to: '63'
  source: llm
  basis: guess
  evidence: 티켓 회수조회 응답에 sendGb='회수완료', lastOrdStatGbcd=63 예시가 있음. write API summary는
    '회수처리'이고 procGb=P0만 보임. 중간 회수 단계 없이 최종 회수완료(63)로 처리할 가능성을 추정.
lookups:
- api: hshop-openapi:POST:/sc/scb/scbd/selectOshpDtlList.do
  selector: {}
  states:
  - '25'
  - '30'
  - '45'
  - '50'
  basis: spec
  evidence: 출고조회 응답에 현재/마지막 진행상태 필드 lastDlvstPrgrGbcd가 있음. write API summary상 이 영역에서
    다루는 상태는 주문확인(P1), 출고완료(P2), 배송완료(P3)이며 응답 예시 상태는 25.
- api: hshop-openapi:POST:/sc/scb/scbd/selectWtdwDtlList.do
  selector: {}
  states:
  - '55'
  - '57'
  - '60'
  - '63'
  basis: guess
  evidence: 회수조회 응답에 lastDlvstPrgrGbcd가 있음. 공통코드의 회수 계열 상태는 55,57,60,63이며 응답 예시 상태는
    55.
- api: hshop-openapi:POST:/sc/scb/scbd/selectCnclList.do
  selector: {}
  states:
  - '70'
  - '73'
  - '75'
  - '77'
  - '79'
  - '81'
  basis: guess
  evidence: 취소조회 API이며 공통코드의 취소 계열 상태는 70,73,75,77,79,81. 응답에는 상태필드가 직접 없고 dlvTypeGbcdNm='취소'만
    보여 어떤 세부 상태가 노출되는지 확정 불가.
- api: hshop-openapi:POST:/sc/scb/scbd/selectTcktOshpList.do
  selector: {}
  states:
  - '20'
  - '80'
  - '81'
  basis: guess
  evidence: 티켓 주문조회 응답에 lastOrdStatGbcd가 있음. 예시는 20=결제완료. 티켓 주문처리 후 완료/취소완료로 갈 가능성이
    있으나 명세상 확정 불가.
- api: hshop-openapi:POST:/sc/scb/scbd/selectTcktWtdwList.do
  selector: {}
  states:
  - '55'
  - '63'
  basis: guess
  evidence: 티켓 회수조회 응답에 lastOrdStatGbcd가 있고 예시가 63=회수완료. 회수 대상 조회이므로 최소 55와 63은 포함된다고
    볼 수 있으나 중간 57/60 노출 여부는 불명.
open_questions:
- multiOshpProcess.do 의 P1(주문확인)이 정확히 25→30인지, 또는 25를 유지하는지 확인 필요.
- multiOshpBackProcess.do 의 procGb=PB1 이 정확히 어떤 ORD_STAT_GBCD 로 바뀌는지 확인 필요. 77(취소출고)
  추정만 가능.
- multiWtdwProcess.do 가 55→57인지, 55→60인지, 또는 단계별로 여러 동작이 있는지 명세상 불명.
- 회수확인(60), 회수완료(63)를 만드는 별도 write API 또는 multiWtdwProcess 내부 선택값 존재 여부 확인 필요.
- 취소 계열 상태 70/73/75/77/79/81 각각을 만드는 write API 매핑이 자료에 충분히 없음.
- selectCnclList.do 응답에는 ORD_STAT_GBCD 상태필드가 직접 보이지 않음. 취소조회에서 실제 상태를 어떤 필드로 확인하는지
  확인 필요.
- 티켓 주문/회수 API의 lastOrdStatGbcd 가 동일한 ORD_STAT_GBCD 코드그룹인지, 그리고 multiTcktOrdProcess/multiTcktWtdwProcess
  의 실제 전이 규칙이 무엇인지 확인 필요.
- 출고조회/회수조회 요청의 prgrGb(procGb) 값 P0/P1/P2/P3/PB1 이 조회필터인지 상태코드 매핑인지 추가 확인 필요.
- entry_states 를 25/55/70로 두었으나, 협력사 API 관점에서 20(결제완료)부터 노출되는 주문이 있는지 티켓/비물류 포함 여부
  확인 필요.
