# LLM 요청당 예산 · 모델 가격 — tap.trace 가 읽는다 (시나리오 생성 한 번 = 요청 하나)

budget:
  # 계획 에이전트: ① 의도 분석 1 + ②③ 에이전트 턴(정상 요청 3~5턴 예상, 상한은 agent.max_turns) — 재시도 여유를 더해 10번
  # (워크플로 --workflow 는 ① 1 + ② 1 + ③ 0~1 = 3번 안쪽.) 넘으면 다음 호출 전에 멈추고 이유를 남긴다.
  max_llm_calls: 10
  max_tokens: 120000         # 입력 + 출력 합계. 에이전트는 턴마다 앞의 대화를 다시 보내 워크플로(1만 안팎)보다 많다
  max_seconds: 180           # 요청 하나 전체 (LLM + 코드)
  max_cost_usd: 0.5          # 비용 상한 — 가격이 비어 있는 모델은 비용을 계산하지 못해 이 상한도 적용되지 않는다
  retries: 1                 # 형식 실패 · 거부 · 일시적 API 오류만. 받은 뒤 검사(근거 구절 등)에서 걸린 것은 재시도하지 않는다

# USD / 1M tokens. 모델 이름은 .env 의 OPENAI_DEFAULT_MODEL 과 같게.
# 출처: 제3자 가격 집계(morphllm.com · pricepertoken.com, 2026-11-02 확인) — OpenAI 공식 가격표(developers.openai.com)로 확인할 것
pricing:
  gpt-5.4: {input: 2.50, cached_input: 0.25, output: 15.00}
  gpt-5.5: {input: 5.00, cached_input: 0.50, output: 30.00}

# 계획 에이전트(②③) 정지 조건 — 넘으면 '중단: 계획 에이전트 — 이유' (요청 전체 예산은 위 budget)
agent:
  max_turns: 8               # 에이전트 LLM 호출 수
  max_tool_calls: 24         # 도구 호출 수 (한 턴에 여럿 부를 수 있다)
  max_repeats: 3             # 같은 도구를 같은 입력으로 다시 부른 횟수
  max_rejections: 2          # submit_plan 이 거절된 뒤 고쳐 내는 횟수 (3번째 거절이면 중단)
