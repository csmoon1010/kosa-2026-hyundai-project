# LLM 요청당 예산 · 모델 가격 — tap.trace 가 읽는다 (시나리오 생성 한 번 = 요청 하나)

budget:
  # 정상 요청은 LLM 3번이면 끝난다: ① 의도 분석 1 + ② 상태 고르기 1 + ③ API 고르기 0~1 (애매한 단계가 있을 때만)
  # 여기에 형식 실패 재시도 여유를 더해 6번. 넘으면 다음 호출 전에 멈추고 이유를 남긴다.
  max_llm_calls: 6
  max_tokens: 60000          # 입력 + 출력 합계. 지금 요청 하나가 대략 1만 토큰 안팎 (트레이스로 확인)
  max_seconds: 180           # 요청 하나 전체 (LLM + 코드)
  max_cost_usd: 0.5          # 비용 상한 — 가격이 비어 있는 모델은 비용을 계산하지 못해 이 상한도 적용되지 않는다
  retries: 1                 # '중지조건 · 재시도' 토글 ON 일 때. OFF 면 0 (혜정 IR 생성과 함께 켜고 끈다)
                             # 다시 묻는 것: 형식 실패, 통신 오류(타임아웃 · 연결 실패 · 408 · 429 · 500 · 502 · 503 · 504 — 혜정과 같은 규칙,
                             # 지수 대기 + retry-after, 할당량 · 결제 한도 오류 제외, 대기가 남은 시간보다 길면 멈춤)
                             # 다시 묻지 않는 것: LLM 거절 · 출력 토큰 한도 · 받은 뒤 검사(근거 구절 등)에서 걸린 것
  max_output_tokens: 4096    # 호출당 출력 토큰 상한 — 혜정 IR 생성과 같은 값. 넘으면 멈춤 (OUTPUT_TOKEN_LIMIT)

# 혜정 IR 초안 생성(승인 뒤)의 예산 — 호출 수 · 토큰 · 시간은 혜정 agent/budget.py(단계 수에 비례)가 정하고,
# 비용 상한만 여기서 건다. 사람 승인을 기다린 시간은 어느 쪽 예산에도 넣지 않는다 (구간마다 시계를 따로 잰다).
ir_budget:
  max_cost_usd: 1.0          # 실측: 4단계 IR 1건 약 $0.37 (2026-11-05). 넘으면 멈춤 (RUN_COST_LIMIT)

# USD / 1M tokens. 모델 이름은 .env 의 OPENAI_DEFAULT_MODEL 과 같게.
# 출처: 제3자 가격 집계(morphllm.com · pricepertoken.com, 2026-11-02 확인) — OpenAI 공식 가격표(developers.openai.com)로 확인할 것
pricing:
  gpt-5.4: {input: 2.50, cached_input: 0.25, output: 15.00}
  gpt-5.5: {input: 5.00, cached_input: 0.50, output: 30.00}
