# 도구 권한 등급 · 승인 게이트 — 코드가 정한다 (LLM 은 등급 · 승인에 관여하지 않는다, 요청 문장으로 바꿀 수 없다)
#
# R0 조회                  → 자동
# R1 되돌릴 수 있는 쓰기     → 등록 때 시나리오 승인
# R2 되돌릴 수 없는 쓰기     → 등록 때 시나리오 승인 + 실행할 때마다 그 단계 확인 — Metadata irreversible 불가 · 되돌아가는 경로 없음 · 새로 만들기 · 그래프 없는 수정
# R3 금지                  → 차단 (승인으로도 못 엶) — 1차 범위 밖 도메인 · 삭제류 API
# 등급과 별개로, 사람이 확인하지 않은 선택(가선택 · LLM 이 고른 API)은 등록 때 그 단계를 직접 확인해야 한다.
# 운영 환경은 Tool Registry 에서 이미 빠진다 (allowed_environments 에 PROD 류가 들어가지 않음).

allowed_domains: [pd, od, ds]                  # 1차 범위 — 밖이면 R3
forbidden_words: [삭제, delete, remove, 폐기]   # API 이름 · operation id 에 들어가면 R3 (대소문자 무시)

# 요청 속 지시문(인젝션) — 하나라도 감지되면 ① 의도 분석 직후 멈추고 요청 전체를 차단한다 (② ③ 은 하지 않음, 승인으로도 못 엶)
# 감지 = LLM 이 적은 지시문(요청 원문에 그대로 있는 것만) + 아래 패턴 (대소문자 무시)
injection_patterns: [이전 지시, 무시하고, 시스템 지시, 새 규칙, "###", 답하라, 승인 없이, 승인 절차 없이, 승인 단계는 건너, graph_id, api_id, "procGb="]
